<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Astronomy Picture</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#e6e9ef;
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:absolute;inset:0;overflow:hidden}
  #img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;will-change:transform}
  #img.show{opacity:1}
  body.kb #img.show{animation:kb 40s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1.5%)}}
  #cap{position:absolute;left:0;right:0;bottom:0;padding:60px 40px 30px;
    background:linear-gradient(transparent,rgba(0,0,0,.35) 30%,rgba(0,0,0,.85));display:none}
  body.cap #cap{display:block}
  #cap .date{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;color:#9aa2bd;letter-spacing:.05em;text-transform:uppercase}
  #cap .title{font-size:2rem;font-weight:700;margin:3px 0 6px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #cap .exp{font-size:1rem;line-height:1.45;color:#d4d8e4;max-width:105ch;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  #cap .by{font-size:.85rem;color:#8089a6;margin-top:7px}
  #vid{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:10px}
  #vid .t{font-size:1.8rem;font-weight:700}#vid .e{max-width:70ch;color:#b7bdd0;line-height:1.5}#vid .n{color:#7aa2f7;font-family:ui-monospace,monospace;font-size:.9rem}
  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#556;text-align:center;padding:30px}
  #boot.hidden{display:none}
</style></head>
<body>
  <div id="stage"><img id="img" alt=""></div>
  <div id="cap"><div class="date" id="date"></div><div class="title" id="title"></div><div class="exp" id="exp"></div><div class="by" id="by"></div></div>
  <div id="vid"><div class="t" id="vt"></div><div class="e" id="ve"></div><div class="n">Video APOD — view at apod.nasa.gov</div></div>
  <div id="boot">Loading today's picture…</div>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  var FEED = "https://science.nasa.gov/wp-json/wp/v2/apod-basic?per_page=5", IMG_W = 1600, CACHE = "apod.last";
  var settings = { showText: true, kenBurns: true }, $ = function (i) { return document.getElementById(i); };
  var shown = "", busy = false, retryT = null;

  // Feed text is HTML ("<br>", entities); reduce it to plain text without executing anything.
  function clean(h) {
    var t = new DOMParser().parseFromString(String(h || "").replace(/<br\s*\/?>/gi, " "), "text/html").body.textContent || "";
    return t.replace(/\s+/g, " ").trim();
  }
  function explanation(raw) { return clean(raw).replace(/^Explanation:\s*/, "").split(/\s*Tomorrow's picture:/)[0].trim(); }
  // NASA's dynamicimage URLs take a width; ask for a screen-sized image instead of the 4K original.
  // new URL() also percent-encodes non-ASCII characters in the path.
  function imgSrc(item) {
    var raw = item.hdurl; if (!raw || /(^|[^a-z])logo([^a-z]|$)/.test(raw.toLowerCase())) return null;
    try { var u = new URL(raw); if (/\/dynamicimage\//.test(u.pathname)) { u.searchParams.set("w", Math.min(IMG_W, Number(u.searchParams.get("w")) || IMG_W)); u.searchParams.delete("h"); } return u.href; }
    catch (e) { return null; }
  }
  function loads(src) {
    return new Promise(function (ok) {
      var im = new Image(), t = setTimeout(function () { done(false); }, 10000);
      function done(v) { clearTimeout(t); im.onload = im.onerror = null; if (!v) im.src = ""; ok(v); }
      im.onload = function () { done(im.naturalWidth >= 200); };  // tiny images are placeholders, not pictures
      im.onerror = function () { done(false); };
      im.src = src;
    });
  }
  function within(p, ms) {
    return Promise.race([p, new Promise(function (_, no) { setTimeout(function () { no(new Error("timed out")); }, ms); })]);
  }
  function record(item, src) {
    return { date: item.date || "", title: clean(item.title), explanation: explanation(item.explanation),
      credit: clean(item.credit || item.copyright), video: item.media_type !== "image", src: src };
  }
  // The feed is newest-first: show the first entry that is a video or an image that really loads.
  async function pick(items) {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.media_type !== "image") return record(it, null);
      var src = imgSrc(it);
      if (src && await loads(src)) return record(it, src);
    }
    return null;
  }
  function render(d) {
    var k = d.date + "|" + d.src; if (k === shown) return; shown = k;
    if (d.video || !d.src) {
      $("vid").style.display = "flex"; $("cap").style.display = "none"; $("img").classList.remove("show");
      $("vt").textContent = d.title; $("ve").textContent = d.explanation; $("boot").classList.add("hidden"); return;
    }
    $("vid").style.display = "none"; $("cap").style.display = "";
    var img = $("img"); img.classList.remove("show");
    img.onload = function () { img.classList.add("show"); $("boot").classList.add("hidden"); };
    img.onerror = function () { shown = ""; $("boot").classList.remove("hidden"); $("boot").textContent = "Image failed to load"; retrySoon(); };
    img.src = d.src;
    $("date").textContent = d.date; $("title").textContent = d.title; $("exp").textContent = d.explanation;
    $("by").textContent = d.credit ? "Credit: " + d.credit : "NASA APOD";
  }
  function applySettings() {
    document.body.classList.toggle("cap", settings.showText !== false);
    document.body.classList.toggle("kb", settings.kenBurns !== false);
  }
  // Remembered between runs if the sandbox allows storage; otherwise the picture just stays on screen.
  function remember(d) { try { localStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) {} }
  function recall() { try { return JSON.parse(localStorage.getItem(CACHE) || "null"); } catch (e) { return null; } }

  function retrySoon() { clearTimeout(retryT); retryT = setTimeout(load, 60000); }

  async function load() {
    if (busy) return; busy = true;
    try {
      var res = await within(xemd.proxy.fetch(FEED, { headers: { Accept: "application/json" } }), 20000);
      if (!res.ok) throw new Error("HTTP " + res.status);
      var d = await pick(await within(res.json(), 20000));
      if (!d) throw new Error("no usable entry");
      render(d); remember(d);
    } catch (e) {
      if (!shown) { var c = recall(); if (c && c.date && (c.src || c.video)) render(c); else $("boot").textContent = "NASA APOD unavailable: " + (e.message || e); }
    } finally { busy = false; if (!shown) retrySoon(); }
  }

  (async function () {
    try { var s = await Promise.race([xemd.settings.get(), new Promise(function (r) { setTimeout(function () { r(null); }, 1500); })]); if (s) settings = Object.assign(settings, s); } catch (e) {}
    applySettings();
    xemd.onSettingsChange(function (s) { if (s) settings = Object.assign(settings, s); applySettings(); });
    xemd.onRefresh(load);
    xemd.ready();
    load();
  })();
</script></body></html>
